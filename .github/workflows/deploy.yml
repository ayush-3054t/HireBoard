name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  # ── Deploy Backend (server/) ──────────────────────────────────────────────
  deploy-server:
    name: Deploy Server API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Server to Vercel Production
        working-directory: server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SERVER_PROJECT_ID }}
        run: vercel --prod --yes --token=$VERCEL_TOKEN

  # ── Deploy Frontend (client/) ─────────────────────────────────────────────
  deploy-client:
    name: Deploy Client App
    runs-on: ubuntu-latest
    needs: deploy-server        # ensure the API is ready before the frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Client to Vercel Production
        working-directory: client
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}
        run: vercel --prod --yes --token=$VERCEL_TOKEN
